<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>流亡倖存者</title><link rel="stylesheet" href="./game.css?v=0.3.1">
</head><body>
<canvas aria-label="流亡倖存者戰場"></canvas>
<header><div class="brand">流亡倖存者 <small>v0.3.1</small></div><div id="status">載入引擎中…</div><button id="gems" aria-haspopup="dialog">寶石</button><button id="restart">重開</button></header>
<section class="meters" aria-label="角色資源"><label>生命<progress id="life" max="1" value="1"></progress><span id="life-num"></span></label><label>魔力<progress id="mana" max="1" value="1"></progress><span id="mana-num"></span></label></section>
<div id="hint">拖曳或 WASD 移動 · 自動攻擊</div>
<div id="toast" role="status"></div>
<section id="reward" class="modal" aria-label="升級寶石獎勵" hidden></section>
<dialog id="gem-panel" aria-labelledby="gem-title"></dialog>
<noscript>請開啟 JavaScript 才能玩。</noscript>
<script type="module" src="./play.mjs?v=0.3.1"></script>
</body></html>
